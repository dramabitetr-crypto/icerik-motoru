name: Video Uretim Motoru

on:
  workflow_dispatch:
    inputs:
      konu:
        description: 'Videonun Konusu'
        required: true
        default: 'Sokak Kedileri'

jobs:
  video_uret:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri Indir
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' /etc/ImageMagick-6/policy.xml
          python -m pip install --upgrade pip
          pip install requests gTTS moviepy==1.0.3 numpy==1.24.3 Pillow==10.1.0

      - name: Motoru Calistir
        run: python action_bot.py
        env:
          KONU: ${{ github.event.inputs.konu }}
          BOT_TOKEN: "9119725211:AAEZ79N0n7ugM45QhR_z3wmEP1AnA0TtqXs"
