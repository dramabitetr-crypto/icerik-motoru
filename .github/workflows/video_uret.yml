name: Video Uretim Motoru

on:
  workflow_dispatch:
    inputs:
      konu:
        description: 'Videonun Konusu'
        required: true
        default: 'Sokak Kedileri'

jobs:
  video_uret:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri İndir
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Motoru Çalıştır
        run: python action_bot.py
        env:
          KONU: ${{ github.event.inputs.konu }}
          BOT_TOKEN: "9119725211:AAEZ79N0n7ugM45QhR_z3wmEP1AnA0TtqXs"
          CHAT_ID: "6280357308"
