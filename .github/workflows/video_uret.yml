name: Levent Video Motoru

on:
  workflow_dispatch:
    inputs:
      konu:
        description: 'Videonun Konusu (Levent ne anlatsın?)'
        required: true
        default: 'Metrodaki Gizemli Kedi'

jobs:
  levent_video_uret:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Zorla İndir (ImageMagick Dahil)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' /etc/ImageMagick-6/policy.xml
          python -m pip install --upgrade pip
          pip install requests gTTS moviepy==1.0.3 numpy==1.24.3 Pillow==9.5.0

      - name: Levent Motorunu Çalıştır
        run: python action_bot.py
        env:
          KONU: ${{ github.event.inputs.konu }}
          BOT_TOKEN: "9119725211:AAEZ79N0n7ugM45QhR_z3wmEP1AnA0TtqXs"
          CHAT_ID: "6280357308"
