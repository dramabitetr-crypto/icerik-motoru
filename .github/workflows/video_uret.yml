name: Video Uretim Motoru

on:
  workflow_dispatch:
    inputs:
      konu:
        description: 'Videonun Konusu'
        required: true
        default: 'Sokak Kedileri'

jobs:
  video_uret:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # En güncel ve hatasız kütüphane kurulum komutları (ImageMagick sınırını tamamen ezen taktik)
      - name: Kutuphaneleri ve Bagimliliklari Indir
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # Güvenlik duvarını esnek hale getiren kendi kuralımızı doğrudan oluşturuyoruz (Klasör versiyonu fark etmez)
          mkdir -p ~/.magick
          echo '<policymap><policy domain="path" rights="read | write" pattern="@*" /></policymap>' > ~/.magick/policy.xml
          python -m pip install --upgrade pip
          pip install requests gTTS moviepy==1.0.3 numpy==1.24.3 Pillow==9.5.0

      - name: Motoru Calistir
        run: python action_bot.py
        env:
          KONU: ${{ github.event.inputs.konu }}
          BOT_TOKEN: "9119725211:AAEZ79N0n7ugM45QhR_z3wmEP1AnA0TtqXs"
          CHAT_ID: "6280357308" 
